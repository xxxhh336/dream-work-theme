name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Stable release tag such as v0.1.2. Leave empty to update nightly. Select main under Use workflow from.'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - name: Prepare release version
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-release-version.cjs
      - run: pnpm install --frozen-lockfile
      - name: Build Windows x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run build:win:x64
      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          compression-level: 0
          retention-days: 14
          path: |
            dist/Dream-Work-Theme-*-win-x64.exe
            dist/Dream-Work-Theme-*-win-x64.exe.blockmap
          if-no-files-found: error

  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - name: Prepare release version
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-release-version.cjs
      - name: Install deb packaging tools
        run: sudo gem install --no-document fpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:linux:x64
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          compression-level: 0
          retention-days: 14
          path: |
            dist/Dream-Work-Theme-*-linux-x86_64.AppImage
            dist/Dream-Work-Theme-*-linux-amd64.deb
            dist/Dream-Work-Theme-*-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - name: Validate native architecture
        shell: bash
        run: |
          set -euo pipefail
          expected_arch="${{ matrix.arch }}"
          test "$(node -p 'process.arch')" = "$expected_arch"
      - name: Prepare release version
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/prepare-release-version.cjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          compression-level: 0
          retention-days: 14
          path: |
            dist/Dream-Work-Theme-*-mac-${{ matrix.arch }}.dmg
            dist/Dream-Work-Theme-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Download platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir downloaded-artifacts
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
            prerelease=false
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="nightly"
            prerelease=true
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=false
          else
            tag="nightly"
            prerelease=true
          fi
          build_sha="$(git rev-parse HEAD)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "build_sha=${build_sha}" >> "$GITHUB_OUTPUT"
      - name: Create or update nightly release
        if: steps.metadata.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.metadata.outputs.build_sha }}
        shell: bash
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$BUILD_SHA" \
              -F force=true
            gh release edit nightly \
              --target "$BUILD_SHA" \
              --title "Nightly Build" \
              --notes "Automated build from commit $BUILD_SHA." \
              --prerelease
          else
            gh release create nightly \
              --target "$BUILD_SHA" \
              --title "Nightly Build" \
              --notes "Automated build from commit $BUILD_SHA." \
              --prerelease
          fi
      - name: Create stable release when missing
        if: steps.metadata.outputs.tag != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_SHA: ${{ steps.metadata.outputs.build_sha }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
                gh api \
                  --method PATCH \
                  "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
                  -f sha="$BUILD_SHA" \
                  -F force=true
              else
                gh api \
                  --method POST \
                  "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$RELEASE_TAG" \
                  -f sha="$BUILD_SHA"
              fi
            fi
            gh release create "$RELEASE_TAG" \
              --target "$BUILD_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
